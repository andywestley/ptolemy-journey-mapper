name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Build Dependencies
        run: npm ci

      - name: Build Minified CSS & JS Assets
        run: npm run minify

      - name: Deploy via SSH rsync
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "" # Deploy the entire repository
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: ${{ secrets.VPS_TARGET }}
          EXCLUDE: "/.git/, /.github/, /node_modules/, /config/database.php, /data.db, /pb_data/" # Avoid sending git history, node_modules, and deleting server DB/config
